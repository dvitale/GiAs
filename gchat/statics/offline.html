<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIAS Chat - Offline</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #fef3c7, #fde68a);
            color: #1e293b;
            padding: 20px;
        }
        .offline-container {
            text-align: center;
            max-width: 420px;
            background: white;
            border-radius: 16px;
            padding: 40px 30px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.1);
        }
        .offline-icon {
            font-size: 64px;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 22px;
            margin-bottom: 12px;
            color: #d97706;
        }
        p {
            font-size: 15px;
            line-height: 1.5;
            color: #64748b;
            margin-bottom: 24px;
        }
        .retry-btn {
            display: inline-block;
            padding: 12px 28px;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
        }
        .retry-btn:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="offline-icon">&#x1F4E1;</div>
        <h1>Connessione non disponibile</h1>
        <p>
            GIAS Chat ha bisogno di una connessione internet per funzionare.
            Verifica la tua connessione e riprova.
        </p>
        <button class="retry-btn" onclick="window.location.reload()">Riprova</button>
    </div>
</body>
</html>
